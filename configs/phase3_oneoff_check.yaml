# Phase 3.2: does continuous one-off traffic hurt native LRU? 2 req/s, 800 blocks, caching on.
# Compare with phase2_three_scenarios/stable (no one-off traffic).
name: phase3_oneoff_check
defaults:
  model: Qwen/Qwen2.5-3B-Instruct
  num_gpu_blocks: 800
  prefix_caching: true
  policy: lru
runs:
  - label: oneoff15
    trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r2.0_T300_oneoff0.15_s0.jsonl
  - label: oneoff30
    trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r2.0_T300_oneoff0.3_s0.jsonl
