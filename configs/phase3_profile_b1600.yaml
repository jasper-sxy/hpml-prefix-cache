# Phase 3.4 profiling at 1600 blocks: same traces as the Phase 3.3 baselines, with vLLM's
# per-iteration log on and /metrics snapshots, to split time into queueing, prefill and decode.
name: phase3_profile_b1600
defaults:
  model: Qwen/Qwen2.5-3B-Instruct
  num_gpu_blocks: 1600
  policy: lru
  extra_server_args: [--enable-logging-iteration-details]
runs:
  - {label: stable_off_r2, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r2.0_T300_s0.jsonl}
  - {label: stable_lru_r2, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r2.0_T300_s0.jsonl}
  - {label: stable_off_r6, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r6.0_T300_s0.jsonl}
  - {label: stable_lru_r12, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r12.0_T300_s0.jsonl}
  - {label: stable_lru_r14, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r14.0_T300_s0.jsonl}
  - {label: oneoff30_lru_r8, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r8.0_T300_oneoff0.3_s0.jsonl}
  - {label: oneoff30_lru_r10, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r10.0_T300_oneoff0.3_s0.jsonl}
