# Phase 3.5 quality check: 50 SQuAD questions (eval/qa_squad_n50.json) at 1600 blocks,
# one at a time and mixed into the stable traces (each question 4 times). Score with eval/score_qa.py.
name: phase3_qa
defaults:
  model: Qwen/Qwen2.5-3B-Instruct
  num_gpu_blocks: 1600
  policy: lru
runs:
  - {label: qa_off_seq, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/qa_squad_n50_seq_sp1.5.jsonl}
  - {label: qa_lru_seq, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/qa_squad_n50_seq_sp1.5.jsonl}
  - {label: qa_off_mix_r6, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/qa_squad_n50_mix_L1024_a0.9_r6.0_T300_s0.jsonl}
  - {label: qa_lru_mix_r12, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/qa_squad_n50_mix_L1024_a0.9_r12.0_T300_s0.jsonl}
