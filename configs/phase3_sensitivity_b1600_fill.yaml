  - {label: stable_L2048_lru_r5, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L2048_a0.9_r5.0_T300_s0.jsonl}
  - {label: oneoff30_L2048_lru_r2, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L2048_a0.9_r2.0_T300_oneoff0.3_s0.jsonl}
