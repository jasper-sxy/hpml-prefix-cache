# Phase 3 batch D fill-in at 1600 blocks, native LRU: extend the rate range so every
# sensitivity curve has a knee (prefix 2048: lower rates; alpha 1.2 / prefix 512: higher).
name: phase3_sensitivity_b1600_fill
defaults:
  model: Qwen/Qwen2.5-3B-Instruct
  num_gpu_blocks: 1600
  prefix_caching: true
  policy: lru
runs:
