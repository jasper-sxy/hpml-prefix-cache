# Phase 3.3 coarse sweep, batch B: 1600 KV blocks around the knee, 1 run each.
# Same configs as batch A; fewer preemptions expected, larger prefix cache.
name: phase3_sweep_b1600
defaults:
  model: Qwen/Qwen2.5-3B-Instruct
  num_gpu_blocks: 1600
  policy: lru
runs:
  - {label: stable_off_r6, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r6.0_T300_s0.jsonl}
  - {label: stable_lru_r6, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r6.0_T300_s0.jsonl}
  - {label: oneoff30_lru_r6, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r6.0_T300_oneoff0.3_s0.jsonl}
  - {label: stable_off_r8, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r8.0_T300_s0.jsonl}
  - {label: stable_lru_r8, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r8.0_T300_s0.jsonl}
  - {label: oneoff30_lru_r8, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r8.0_T300_oneoff0.3_s0.jsonl}
  - {label: stable_off_r10, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r10.0_T300_s0.jsonl}
  - {label: stable_lru_r10, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r10.0_T300_s0.jsonl}
  - {label: oneoff30_lru_r10, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r10.0_T300_oneoff0.3_s0.jsonl}
  - {label: stable_off_r12, prefix_caching: false, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r12.0_T300_s0.jsonl}
  - {label: stable_lru_r12, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r12.0_T300_s0.jsonl}
  - {label: oneoff30_lru_r12, prefix_caching: true, trace: workload/traces/Qwen__Qwen2.5-3B-Instruct/L1024_a0.9_r12.0_T300_oneoff0.3_s0.jsonl}
