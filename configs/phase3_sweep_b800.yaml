# Phase 3.3 coarse sweep, batch A: 800 KV blocks, 1 run each.
# Configs: stable + caching off, stable + LRU, 30% one-off + LRU.
name: phase3_sweep_b800
defaults:
  model: Qwen/Qwen2.5-3B-Instruct
  num_gpu_blocks: 800
  policy: lru
runs:
